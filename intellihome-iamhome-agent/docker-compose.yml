version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: intellihome-iamhome-agent_web_1
      APP_PORT: 8766

  web:
    image: ghcr.io/richiinfoset/iamhome-agent:2.0.4@sha256:29bd8f39aef768526626afc9b3b66e18e2cc85e949c526a409fb3e95e379f04b
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    ports:
      - "8765:8765"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      UMBREL_APP: "1"
      STATE_FILE: /data/state.json
      TZ: Europe/Prague
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME}
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
