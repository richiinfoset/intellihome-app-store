version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: intellihome-iamhome-agent_web_1
      APP_PORT: 8766

  web:
    image: ghcr.io/richiinfoset/iamhome-agent:1.3.3@sha256:361e705024047e418b449b57baf9d178a6c02ffdc21b58a8d6940bdeba5e683c
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    ports:
      - "8765:8765"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      UMBREL_APP: "1"
      STATE_FILE: /data/state.json
      TZ: Europe/Prague
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME}
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
