version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: intellihome-iamhome-agent_web_1
      APP_PORT: 8766

  web:
    image: ghcr.io/richiinfoset/iamhome-agent:2.2.3@sha256:741528678a6a265d90b72fa630dd9e3f4f0e4813c182e28f3bb58d95a9d1dcec
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    ports:
      - "8765:8765"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      UMBREL_APP: "1"
      STATE_FILE: /data/state.json
      TZ: Europe/Prague
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME}
      APP_SEED: ${APP_SEED}
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
