version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: intellihome-iamhome-agent_web_1
      APP_PORT: 8766

  web:
    image: ghcr.io/richiinfoset/iamhome-agent:1.2.2@sha256:020f11a4cd9dd0a407df4dd6b829bfbd581a6b214d2a6b239422d1d519fceb34
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    ports:
      - "8765:8765"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      UMBREL_APP: "1"
      STATE_FILE: /data/state.json
      TZ: Europe/Prague
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME}
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
