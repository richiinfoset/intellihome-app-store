name: IamHome Agent
version: "2.1.6"
tagline: AI agent and health monitoring for your Umbrel
icon: "data:image/png;base64,"
description: >-
  Chat with an AI agent that sees the state of your Umbrel and can control apps (irreversible
  actions need double confirmation and a separate password). Monitoring every 15 minutes without AI,
  e-mail alerts, a morning report, forecasts (disk, memory, crashes, temperature) and a dashboard.


  First start: open the app and enter the one-time setup code from the app logs
  (Settings → Troubleshoot → this app).
