releaseNotes: >-
  What's new in 2.1.6:
    - Stronger login password. A new login password (wizard, Settings, forgotten password) must have, besides 20 characters, at least 3 of 4 types: uppercase, lowercase, digits, special characters. The generated password contains all of them. The current password keeps working.
    - Model picker shows only configured providers. Chat and the task form offer only Claude (with an API key), Ollama (with an address or model filled in) and the OpenAI compatible models set in Settings → AI model.
